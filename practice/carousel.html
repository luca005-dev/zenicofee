<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80vh;

        }

 .carousel{

    height: 60vh;

    overflow-x: scroll;

    border-radius: 15px;

    display: flex;

    align-items: center;


width: 60vh;
   

}

.track{
   display: flex;

   align-items: center;

   height: 100%;

  /* width: fit-content;*/

   gap: 1rem;

   border-radius: 13px;

    transition: all 0.6s ease;
}

.carousel::-webkit-scrollbar{
    display: none;
}


.card{

    flex: 0 0 30%;

    height: 90%;

    background-color: rgb(49, 49, 67);


    border-radius: 11px;

    text-align: center;

    align-content: center;
}

.card:nth-child(odd){
    background-color: rgb(50, 50, 135);
}

.card:nth-child(even){
    background-color: rgb(149, 149, 217);
}

.card:hover{
    transform: scale(1.005);
}

    </style>
</head>
<body>

    <div class="carousel">

        <div class="track">

                <article class="card">card 1</article>
                <article class="card">card 2</article>
                <article class="card">card 3</article>
                <article class="card">card 4</article>
                <article class="card">card 5</article>
                <article class="card">card 6</article>
                <article class="card">card 7</article>
                <article class="card">card 8</article>
                <article class="card">card 9</article>
                <article class="card">card 10</article>

        </div>

    </div>

       <script>

const carousel = document.querySelector('.carousel');

const track = document.querySelector('.track');

const cards = document.querySelectorAll('.card');

const firstClone = cards[0].cloneNode(true);
const lastClone = cards[cards.length - 1].cloneNode(true);

track.appendChild(firstClone);
track.insertBefore(lastClone, track.firstChild);

const allCards = document.querySelectorAll('.card');

carousel.style.backgroundColor = 'black';

let currentIndex = 1;

track.style.transform = "translateX(" + -(cards[0].offsetWidth + parseFloat(getComputedStyle(track).gap)) * currentIndex + "px)";

let cardWidth = cards[0].offsetWidth 

//+ 16;- 16px is the gap between cards     
let gap=parseFloat(getComputedStyle(track).gap); // Get the gap value from CSS

setInterval(() => {
    currentIndex++;
    if (currentIndex >= cards.length) {
        currentIndex = 0;
    }
    nowTranslateX = -(cardWidth + gap) * currentIndex;
    track.style.transform="translateX(" + nowTranslateX + "px)";

}, 1000);

    track.addEventListener('transitionend', () => {
        if (allCards[currentIndex].id === firstClone.id) {
            track.style.transition = 'none';
            currentIndex = 1;
            track.style.transform = "translateX(" + -(cardWidth + gap) * currentIndex + "px)";
        }
        if (allCards[currentIndex].id === lastClone.id) {
            track.style.transition = 'none';
            currentIndex = cards.length - 2;
            track.style.transform = "translateX(" + -(cardWidth + gap) * currentIndex + "px)";
        }

    });

       </script>    
    
</body>
</html>
