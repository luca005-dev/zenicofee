<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link rel="stylesheet" href="p1.css">

</head>

<body>

    <header></header>

    <main>

        <section class="formSection">

            <fieldset>

                <legend>sign up</legend>

                <form action="submit" id="signupForm" method="POST">

                    <div class="formGroup">

                        <input type="text" required maxlength="20" minlength="10" placeholder="enter full name">

                    </div>

                    <div class="formGroup">

                        <input type="email" required minlength="10" placeholder="enter email">

                    </div>

                    <div class="formGroup">

                        <input type="tel" required minlength="10" placeholder="enter phone number">
                    </div>

                    <button class="submitButton"></button>

                </form>

            </fieldset>


        </section>

    </main>


    <footer></footer>

</body>

</html>
